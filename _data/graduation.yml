# everything on the invitation comes from here. replace the placeholders.
poster: /assets/img/graduation-poster.jpg

# one entry per day you'll be there. keep the quotes and the +07:00 (vietnam time).
# end: when it finishes. shown on the page and used for the "add to calendar" event.
days:
  - start: "2026-11-27T09:35:00+07:00"
    end: "2026-11-27T11:35:00+07:00"
  - start: "2026-11-28T17:30:00+07:00"
    end: "2026-11-28T18:30:00+07:00"

venue: A5
address: HCMUT, 268 Đ. Lý Thường Kiệt, Diên Hồng, Hồ Chí Minh
map: https://maps.app.goo.gl/93vjgKQHn5GQSSNQ6
# "campus map →" link in the where card (leave empty to hide)
campus_map_link: https://drive.google.com/file/d/1ueLD8Y1Efnt28OXl0aOpp7mthloVN2dy/view?usp=sharing
# location shown in google / apple / outlook calendar events (google maps finds this name)
calendar_location: University of Technology - Vietnam National University Ho Chi Minh City, 268 Lý Thường Kiệt, Hồ Chí Minh

# tap-to-call on phones. keep the quotes so the leading 0 stays.
contacts:
  - name: Huy
    phone: "0906980801"
  - name: Mom
    phone: "0939226162"

note:          # optional line under the buttons, e.g. where to meet for photos

