bio: >
  Huy is an AI engineer and researcher. He obtained his Bachelor of Engineering in Computer Science
  (Honors Program) from Ho Chi Minh City University of Technology, where he worked
  on knowledge-graph-based recommendation at the HPCC Lab under <a href="https://scholar.google.com/citations?user=m2fgQRAAAAAJ&hl=vi">Assoc. Prof. Dr. Thoai Nam</a>.
  He is currently an AI engineer at Cake Digital Bank, working on face-related problems. His interests are computer vision, graph neural networks
  and recommendation systems.
