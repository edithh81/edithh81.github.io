<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="16x16 32x32">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
</head>
<body>
  <main class="page">
    {{ content }}
    <footer class="footer">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span>
      <span>last updated {{ site.time | date: '%d %b %Y' | downcase }}</span>
    </footer>
  </main>
</body>
</html>
