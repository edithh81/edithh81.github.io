<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="page">
    {{ content }}
    <footer class="footer">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span>
      <span>last updated {{ site.time | date: '%d %b %Y' | downcase }}</span>
    </footer>
  </main>
</body>
</html>
